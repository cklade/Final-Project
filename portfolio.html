<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klade Photography</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="section">
      <div class="container is-max-desktop">
        <div
          class="is-flex is-justify-content-space-between is-align-items-center mb-5 is-flex-wrap-wrap"
        >
          <h1 class="title is-2 has-text-black mb-0">Portfolio</h1>
          <a href="cart.html" class="cart-status-box cart-link">
            Cart: <span id="cartCount">0</span> photo(s)
          </a>
        </div>

        <nav
          class="navbar custom-navbar mb-6"
          role="navigation"
          aria-label="main navigation"
        >
          <div class="navbar-menu is-active">
            <div class="navbar-start nav-center">
              <a
                class="navbar-item has-text-white has-text-weight-bold"
                href="homepage.html"
                >Home</a
              >
              <a
                class="navbar-item has-text-white has-text-weight-bold"
                href="about.html"
                >About</a
              >
              <a
                class="navbar-item has-text-white has-text-weight-bold"
                href="portfolio.html"
                >Portfolio</a
              >
              <a
                class="navbar-item has-text-white has-text-weight-bold"
                href="booking.html"
                >Book Appointment</a
              >
              <a
                class="navbar-item has-text-white has-text-weight-bold"
                href="review.html"
                >Reviews</a
              >
              <a
                class="navbar-item has-text-white has-text-weight-bold"
                href="contact.html"
                >Contact</a
              >
              <a
                class="navbar-item has-text-white has-text-weight-bold"
                href="login.html"
                >Login</a
              >
            </div>
          </div>
        </nav>

        <section class="mb-5">
          <h2 class="title is-4 has-text-black">
            A selection of our recent work
          </h2>
          <p class="featured-subtext">
            Browse the gallery and add your favorite photos to your cart.
          </p>
        </section>

        <section>
          <div class="columns is-multiline">
            <div class="column is-one-third-desktop is-half-tablet">
              <div class="portfolio-card">
                <figure class="image portfolio-image">
                  <img src="pictures/IMG_1271.jpg" alt="Urban Sunset" />
                </figure>
                <p class="portfolio-label">Urban Sunset</p>
                <p class="portfolio-price" data-price-for="urban-sunset">
                  $0.00
                </p>

                <div class="portfolio-card-actions">
                  <button
                    class="button hero-button-primary add-to-cart-button"
                    data-photo-id="urban-sunset"
                    data-name="Urban Sunset"
                    data-image="pictures/IMG_1271.jpg"
                    data-price="0"
                  >
                    Add to Cart
                  </button>
                </div>
              </div>
            </div>

            <section>
              <div id="portfolioPhotosContainer" class="columns is-multiline"></div>
            </section>
    </section>

    <script type="module" src="auth.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="portfolio.js"></script>
    <script type="module" src="auth-ui.js"></script>
  </body>
</html>
